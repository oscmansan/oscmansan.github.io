{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: "OM" monogram on the accent blue -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#f5f7fb"/>

<meta name="keywords" content="{{ site.author.keywords | concat: site.author.seo_keywords | join: ', ' }}"/>

<!-- Light by default; dark only if the visitor picked it with the toggle.
     Runs before first paint to avoid a flash of the wrong theme. -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = "light";
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  })();
</script>

<!-- Web fonts: self-hosted (assets/fonts, OFL) and preloaded so they are ready
     at first paint; avoids the layout shift of a late font swap. -->
<link rel="preload" href="{{ base_path }}/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ base_path }}/assets/fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin>

<!-- end custom head snippets -->
