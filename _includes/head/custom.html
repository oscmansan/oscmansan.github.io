{% include base_path %}

<!-- start custom head snippets -->

<!-- favicon: "OM" monogram on the accent blue -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico"/>
<meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#1a1816" media="(prefers-color-scheme: dark)"/>
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<meta name="keywords" content="{{ site.author.keywords | concat: site.author.seo_keywords | join: ', ' }}"/>

<!-- Follow the visitor's OS color scheme unless they picked one with the toggle.
     Runs before first paint to avoid a flash of the wrong theme. -->
<script>
  (function () {
    var t;
    try { t = localStorage.getItem("theme"); } catch (e) {}
    if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    else document.documentElement.removeAttribute("data-theme");
  })();
</script>

<!-- Web fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">

<!-- end custom head snippets -->
